<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo & Style Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #0b0b0c;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #141416;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        h1 {
            font-size: 1.6rem;
            color: #c5a059;
            text-align: center;
            margin-bottom: 6px;
        }

        p.sub-title {
            font-size: 0.85rem;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }

        .upload-section {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .upload-box {
            flex: 1;
            height: 180px;
            border: 2px dashed #333;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: #0d0d0f;
            transition: 0.2s;
        }

        .upload-box:hover {
            border-color: #c5a059;
        }

        .upload-box input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .upload-label {
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            padding: 10px;
        }

        .prompt-box {
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #0d0d0f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 0.9rem;
            resize: none;
            outline: none;
        }

        textarea:focus {
            border-color: #c5a059;
        }

        button {
            width: 100%;
            background: #c5a059;
            color: #000;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }

        button:hover {
            background: #e5c17c;
        }

        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        .result-box {
            width: 100%;
            height: 320px;
            background: #0d0d0f;
            border: 1px solid #222;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .result-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .loader {
            display: none;
            border: 4px solid #222;
            border-top: 4px solid #c5a059;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI PHOTO & STYLE TRANSFORMER</h1>
        <p class="sub-title">Apni photo upload karo aur kapde / look change karne ke liye prompt likho</p>

        <!-- Image Upload Section -->
        <div class="upload-section">
            <div class="upload-box" id="uploadBox">
                <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
                <span class="upload-label" id="uploadText">📁 Upload Your Photo</span>
                <img id="previewImg" alt="Your Photo">
            </div>
        </div>

        <!-- Prompt Section -->
        <div class="prompt-box">
            <textarea id="promptInput" placeholder="Eg: Change outfit to black oversized streetwear jacket, cinematic lighting, muscular physique..."></textarea>
        </div>

        <button id="generateBtn" onclick="processImage()">Transform Photo</button>

        <!-- Result View -->
        <div class="result-box">
            <div id="loader" class="loader"></div>
            <span id="resultPlaceholder" style="color: #555; font-size: 0.85rem;">Generated photo yahan dikhegi</span>
            <img id="resultImg" alt="Transformed Result">
        </div>
    </div>

    <script>
        let base64Image = "";

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    const preview = document.getElementById('previewImg');
                    preview.src = base64Image;
                    preview.style.display = 'block';
                    document.getElementById('uploadText').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        async function processImage() {
            const prompt = document.getElementById('promptInput').value.trim();
            const btn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');
            const placeholder = document.getElementById('resultPlaceholder');
            const resultImg = document.getElementById('resultImg');

            if (!base64Image) {
                alert("Pehle apni photo upload karein!");
                return;
            }

            if (!prompt) {
                alert("Prompt likhna zaroori hai!");
                return;
            }

            // UI Loading State
            btn.disabled = true;
            btn.innerText = "Transforming...";
            loader.style.display = "block";
            placeholder.style.display = "none";
            resultImg.style.display = "none";

            try {
                // Pollinations / Custom AI Image-to-Image Endpoint
                const encodedPrompt = encodeURIComponent(prompt + ", high quality, detailed outfit, realistic body");
                
                // Image-to-Image API URL Call
                const apiUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=800&height=1000&seed=${Math.floor(Math.random() * 999999)}&nologo=true`;

                resultImg.src = apiUrl;
                
                resultImg.onload = () => {
                    loader.style.display = "none";
                    resultImg.style.display = "block";
                    btn.disabled = false;
                    btn.innerText = "Transform Photo";
                };

                resultImg.onerror = () => {
                    throw new Error("Image processing failed");
                };

            } catch (error) {
                alert("Error generating image. Try again!");
                loader.style.display = "none";
                placeholder.style.display = "block";
                placeholder.innerText = "Failed to load image.";
                btn.disabled = false;
                btn.innerText = "Transform Photo";
            }
        }
    </script>
</body>
</html>
