<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crazy Word Counter | Swayam Maheshwari</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #fff;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 650px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
    }

    p.subtitle {
      font-size: 0.9rem;
      opacity: 0.85;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 160px;
      background: rgba(0, 0, 0, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 15px;
      font-size: 1.1rem;
      color: #fff;
      box-sizing: border-box;
      outline: none;
      resize: vertical;
      transition: all 0.3s ease;
    }

    textarea:focus {
      border-color: #00f2fe;
      box-shadow: 0 0 15px #00f2fe;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.15);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .stat-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .stat-number {
      font-size: 1.8rem;
      font-weight: bold;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffcc;
    }

    .stat-label {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .btn-container {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      background: linear-gradient(45deg, #ff007f, #7928ca);
      border: none;
      color: white;
      padding: 12px 24px;
      font-size: 0.95rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
    }

    footer {
      margin-top: 20px;
      font-size: 0.8rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🔥 Word Counter</h1>
    <p class="subtitle">Created by <b>Swayam Maheshwari</b></p>

    <textarea id="textInput" placeholder="Type or paste your text here to see the magic..."></textarea>

    <div class="btn-container">
      <button class="btn" onclick="clearText()">Clear Text</button>
      <button class="btn" style="background: linear-gradient(45deg, #0070f3, #00dfd8);" onclick="copyText()">Copy Text</button>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-number" id="wordCount">0</div>
        <div class="stat-label">Words</div>
      </div>
      <div class="stat-box">
        <div class="stat-number" id="charCount">0</div>
        <div class="stat-label">Characters</div>
      </div>
      <div class="stat-box">
        <div class="stat-number" id="sentenceCount">0</div>
        <div class="stat-label">Sentences</div>
      </div>
      <div class="stat-box">
        <div class="stat-number" id="readTime">0m</div>
        <div class="stat-label">Read Time</div>
      </div>
    </div>

    <footer>Powered by GitHub Pages • Fast & Minimal</footer>
  </div>

  <script>
    const input = document.getElementById('textInput');
    const wordCount = document.getElementById('wordCount');
    const charCount = document.getElementById('charCount');
    const sentenceCount = document.getElementById('sentenceCount');
    const readTime = document.getElementById('readTime');

    input.addEventListener('input', () => {
      const text = input.value.trim();

      charCount.innerText = input.value.length;

      const words = text ? text.split(/\s+/).filter(w => w.length > 0) : [];
      wordCount.innerText = words.length;

      const sentences = text ? text.split(/[.!?]+/).filter(s => s.trim().length > 0) : [];
      sentenceCount.innerText = sentences.length;

      const minutes = Math.ceil(words.length / 200);
      readTime.innerText = words.length > 0 ? minutes + 'm' : '0m';
    });

    function clearText() {
      input.value = '';
      input.dispatchEvent(new Event('input'));
    }

    function copyText() {
      if(input.value) {
        navigator.clipboard.writeText(input.value);
        alert('Text copied to clipboard!');
      }
    }
  </script>
</body>
</html>
